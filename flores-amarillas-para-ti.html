<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores amarillas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d9ebf1;
    --ink: #17303f;
    --ink-soft: #3d5a6b;
    --stem: #3f7a3c;
    --leaf: #5a9a48;
    --paper: #2f7f86;
    --paper-front: #3a9298;
    --ribbon: #f2a900;
    --focus: #17303f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101c28;
      --ink: #fff2c0;
      --ink-soft: #c9c4a3;
      --stem: #5c9a4b;
      --leaf: #78b45c;
      --paper: #2a6f77;
      --paper-front: #348088;
      --focus: #ffd93d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101c28;
    --ink: #fff2c0;
    --ink-soft: #c9c4a3;
    --stem: #5c9a4b;
    --leaf: #78b45c;
    --paper: #2a6f77;
    --paper-front: #348088;
    --focus: #ffd93d;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 2rem 1.25rem 2.5rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3.4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
    max-width: 16ch;
    text-wrap: balance;
  }
  .bouquet-btn {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    margin: 0.25rem 0;
    cursor: pointer;
    width: min(88vw, 400px);
    -webkit-tap-highlight-color: transparent;
    border-radius: 24px;
  }
  .bouquet-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .bouquet-btn svg { display: block; width: 100%; height: auto; overflow: visible; }

  .stem { fill: none; stroke: var(--stem); stroke-width: 4; stroke-linecap: round; }
  .leaf { fill: var(--leaf); }
  .paper { fill: var(--paper); }
  .paper-front { fill: var(--paper-front); }
  .ribbon { fill: var(--ribbon); }

  .flower {
    transform: translate(var(--x), var(--y)) scale(0.14);
    transition: transform 1.1s cubic-bezier(0.34, 1.4, 0.5, 1);
  }
  .bloom {
    transform: rotate(calc(var(--r) * 1deg - 50deg));
    transition: transform 1.1s cubic-bezier(0.25, 0.9, 0.35, 1);
  }
  .open .flower {
    transform: translate(var(--x), var(--y)) scale(var(--s));
    transition-delay: calc(var(--d) * 1ms);
  }
  .open .bloom {
    transform: rotate(calc(var(--r) * 1deg));
    transition-delay: calc(var(--d) * 1ms);
  }
  .bouquet { transform-origin: 180px 392px; }
  .open .bouquet { animation: sway 7s ease-in-out 1.6s infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-1.2deg); }
    to   { transform: rotate(1.2deg); }
  }

  .caption { display: grid; width: min(92vw, 30rem); }
  .caption > * { grid-area: 1 / 1; }
  .hint {
    margin: 0;
    align-self: start;
    font-size: 1.05rem;
    color: var(--ink-soft);
    transition: opacity 0.4s;
  }
  .open .hint { opacity: 0; visibility: hidden; }

  .note {
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity 0.9s ease 1.1s, transform 0.9s ease 1.1s, visibility 0s linear 1.1s;
  }
  .open .note { opacity: 1; visibility: visible; transform: none; }
  .note p {
    margin: 0;
    font-family: "Caveat", "Bradley Hand", "Segoe Script", cursive;
    font-weight: 500;
    font-size: clamp(1.6rem, 5.6vw, 2.1rem);
    line-height: 1.25;
    text-wrap: balance;
  }
  .note .sign { margin-top: 0.75rem; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .flower, .bloom, .note, .hint { transition-duration: 0.01s !important; transition-delay: 0s !important; }
    .open .bouquet { animation: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 id="title">Un regalo para ti</h1>

  <button class="bouquet-btn" id="bouquet" type="button" aria-pressed="false" aria-label="Abrir el ramo de flores amarillas">
    <svg viewBox="0 0 360 430" role="img" aria-hidden="true" id="art"></svg>
  </button>

  <div class="caption" aria-live="polite">
    <p class="hint" id="hint">Toca el ramo para abrirlo.</p>
    <div class="note" id="note" aria-hidden="true">
      <p id="msg"></p>
      <p class="sign" id="sign"></p>
    </div>
  </div>
</main>

<script>
  // Personaliza aquí: para quién es, de parte de quién y el mensaje.
  var GIFT = {
    para: "ti",
    de: "",
    msg: "Vi unas flores amarillas y me acordé de ti."
  };

  var FLOWERS = [
    { x: 56,  y: 245, s: 0.70, p: 10, r: 5,   d: 500 },
    { x: 306, y: 245, s: 0.72, p: 10, r: -5,  d: 620 },
    { x: 100, y: 165, s: 0.85, p: 12, r: 10,  d: 300 },
    { x: 262, y: 160, s: 0.90, p: 12, r: -8,  d: 400 },
    { x: 180, y: 105, s: 1.05, p: 14, r: 0,   d: 0   },
    { x: 150, y: 225, s: 0.75, p: 11, r: 14,  d: 200 },
    { x: 214, y: 215, s: 0.78, p: 12, r: -12, d: 100 }
  ];
  var BASE = { x: 180, y: 392 };

  function petals(count, cy, rx, ry, fill, offset) {
    var out = "";
    for (var i = 0; i < count; i++) {
      var a = (i * 360 / count + offset).toFixed(2);
      out += '<ellipse cx="0" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '" transform="rotate(' + a + ')"/>';
    }
    return out;
  }

  function seeds() {
    var out = "";
    for (var i = 1; i <= 16; i++) {
      var ang = i * 137.5 * Math.PI / 180;
      var rad = 2.6 * Math.sqrt(i);
      out += '<circle cx="' + (Math.cos(ang) * rad).toFixed(2) + '" cy="' + (Math.sin(ang) * rad).toFixed(2) + '" r="1.5" fill="#9a6a34"/>';
    }
    return out;
  }

  function quad(t, p0, c, p1) {
    var u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * c.x + t * t * p1.x,
      y: u * u * p0.y + 2 * u * t * c.y + t * t * p1.y
    };
  }

  function leaf(pt, angle) {
    return '<path class="leaf" d="M0 0C8 -11 24 -11 34 0C24 11 8 11 0 0Z" transform="translate(' +
      pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ') rotate(' + angle + ')"/>';
  }

  function build() {
    var stems = "", leaves = "", flowers = "";

    FLOWERS.forEach(function (f) {
      var c = { x: BASE.x + (f.x - BASE.x) * 0.25, y: BASE.y - (BASE.y - f.y) * 0.55 };
      stems += '<path class="stem" d="M' + BASE.x + ' ' + BASE.y + ' Q' + c.x.toFixed(1) + ' ' + c.y.toFixed(1) + ' ' + f.x + ' ' + f.y + '"/>';

      if (f.x === 180) {
        leaves += leaf(quad(0.42, BASE, c, f), -155);
        leaves += leaf(quad(0.58, BASE, c, f), -25);
      } else {
        leaves += leaf(quad(0.5, BASE, c, f), f.x < 180 ? -155 : -25);
      }

      var center =
        '<circle r="15" fill="#6b3f1a"/><circle r="10" fill="#4a2a10"/>' + seeds();
      flowers +=
        '<g class="flower" style="--x:' + f.x + 'px;--y:' + f.y + 'px;--s:' + f.s + ';--d:' + f.d + '">' +
          '<g class="bloom" style="--r:' + f.r + '">' +
            petals(f.p, -30, 10, 26, "#f4b810", 0) +
            petals(f.p, -26, 9, 22, "#ffd93d", 180 / f.p) +
            center +
          '</g>' +
        '</g>';
    });

    var wrap =
      '<path class="paper" d="M112 318 L248 318 L204 412 Q180 421 156 412 Z"/>' +
      '<path class="paper-front" d="M112 318 L180 344 L248 318 L204 412 Q180 421 156 412 Z"/>' +
      '<path class="ribbon" d="M127 348 L233 348 L231 361 L129 361 Z"/>';

    document.getElementById("art").innerHTML =
      '<g class="bouquet">' + stems + leaves + flowers + wrap + '</g>';
  }

  function fill() {
    document.getElementById("msg").textContent = GIFT.msg;
    document.getElementById("sign").textContent = GIFT.de ? "Con cariño, " + GIFT.de : "";
  }

  var stage = document.getElementById("stage");
  var btn = document.getElementById("bouquet");
  var title = document.getElementById("title");
  var note = document.getElementById("note");

  function setOpen(open) {
    stage.classList.toggle("open", open);
    btn.setAttribute("aria-pressed", open ? "true" : "false");
    btn.setAttribute("aria-label", open ? "Cerrar el ramo" : "Abrir el ramo de flores amarillas");
    note.setAttribute("aria-hidden", open ? "false" : "true");
    title.textContent = (open ? "Para " : "Un regalo para ") + GIFT.para;
  }

  btn.addEventListener("click", function () {
    setOpen(!stage.classList.contains("open"));
  });

  build();
  fill();
  setOpen(false);
</script>
</body>
</html>
